name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many -t lint --parallel=3

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema packages/database/prisma/schema.prisma
      - run: pnpm exec nx run-many -t build --parallel=3

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ag2
          POSTGRES_PASSWORD: ag2_test_password
          POSTGRES_DB: ag2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ag2 -d ag2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ag2:ag2_test_password@localhost:5432/ag2_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-test-access-secret-at-least-32-characters
      JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-characters
      COOKIE_SECRET: ci-test-cookie-secret-at-least-32-characters
      S3_ACCESS_KEY_ID: ci-test-key
      S3_SECRET_ACCESS_KEY: ci-test-secret
      S3_BUCKET: ag2-ci-test
      SMTP_HOST: localhost
      SMTP_FROM: noreply@ag2.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate --schema packages/database/prisma/schema.prisma
      - name: Apply migrations to the test database
        run: pnpm exec prisma migrate deploy --schema packages/database/prisma/schema.prisma
      - run: pnpm exec nx run-many -t test --parallel=3

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api.Dockerfile
          push: false
          tags: ag2-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build build-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/build-worker.Dockerfile
          push: false
          tags: ag2-build-worker:ci
          cache-from: type=gha,scope=build-worker
          cache-to: type=gha,mode=max,scope=build-worker
